id = "agent-numbers"
name = "Agent Numbers"
version = "0.1.1"
min_herdr_version = "0.8.2"
description = "Number the agents panel to match focus_agent (prefix+1..9)."
platforms = ["linux", "macos"]

[[actions]]
id = "renumber"
title = "Renumber agents"
contexts = ["global"]
command = ["./renumber.sh"]

[[actions]]
id = "verify"
title = "Verify agent ordering"
contexts = ["global"]
command = ["./verify.sh"]

# Server status changes can reorder the priority panel.

[[events]]
on = "pane.agent_status_changed"
command = ["./renumber.sh"]

# Agents appearing and disappearing, in either sort mode.

[[events]]
on = "pane.agent_detected"
command = ["./renumber.sh"]

[[events]]
on = "pane.created"
command = ["./renumber.sh"]

[[events]]
on = "pane.closed"
command = ["./renumber.sh"]

# Under "spaces" the order is structural, so a pane or space moving reorders the
# panel with no status change at all. Neither event fires in the priority case,
# so carrying both costs nothing there.

[[events]]
on = "pane.moved"
command = ["./renumber.sh"]

[[events]]
on = "workspace.moved"
command = ["./renumber.sh"]

# Focus events also refresh metadata after navigation or reattachment.

[[events]]
on = "pane.focused"
command = ["./renumber.sh"]

[[events]]
on = "tab.focused"
command = ["./renumber.sh"]

[[events]]
on = "workspace.focused"
command = ["./renumber.sh"]
